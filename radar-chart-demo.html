<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Levels Comparison — Radar Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #f8fafc;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
        }
        .chart-wrapper {
            background: #1e293b;
            border-radius: 16px;
            padding: 2rem;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        canvas { width: 100% !important; }
        .legend {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .notes {
            max-width: 720px;
            width: 100%;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>Automation Level Comparison</h1>
    <p class="subtitle">Scored across 9 business criteria (0–10 scale)</p>

    <div class="chart-wrapper">
        <canvas id="radar"></canvas>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#38bdf8"></div>Manual</div>
        <div class="legend-item"><div class="legend-dot" style="background:#34d399"></div>Assisted</div>
        <div class="legend-item"><div class="legend-dot" style="background:#facc15"></div>Semi-Automated</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f87171"></div>Fully Automated</div>
    </div>

    <p class="notes">
        Higher = stronger on that criterion. Data is illustrative only.
    </p>

    <script>
        const labels = [
            'Quality Control',
            'Cost Efficiency',
            'Speed / Throughput',
            'Scalability',
            'Flexibility',
            'Initial Setup Ease',
            'Ongoing Maintenance',
            'Staff Skill Requirement',
            'Risk of Errors'
        ];

        const options = {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
                r: {
                    beginAtZero: true,
                    max: 10,
                    ticks: {
                        stepSize: 2,
                        color: '#64748b',
                        backdropColor: 'transparent',
                        font: { size: 11 }
                    },
                    grid: { color: 'rgba(148,163,184,0.15)' },
                    angleLines: { color: 'rgba(148,163,184,0.15)' },
                    pointLabels: {
                        color: '#cbd5e1',
                        font: { size: 13, weight: '500' }
                    }
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1e293b',
                    titleColor: '#f8fafc',
                    bodyColor: '#cbd5e1',
                    borderColor: '#334155',
                    borderWidth: 1,
                    padding: 12,
                    cornerRadius: 8,
                    callbacks: {
                        label: ctx => `${ctx.dataset.label}: ${ctx.raw}/10`
                    }
                }
            }
        };

        function ds(label, data, color) {
            return {
                label,
                data,
                borderColor: color,
                backgroundColor: color.replace('1)', '0.12)'),
                borderWidth: 2.5,
                pointRadius: 4,
                pointBackgroundColor: color,
                pointBorderColor: '#1e293b',
                pointBorderWidth: 1.5,
                fill: true
            };
        }

        new Chart(document.getElementById('radar'), {
            type: 'radar',
            data: {
                labels,
                datasets: [
                    ds('Manual',              [9, 3, 2, 1, 9, 9, 8, 9, 2], 'rgba(56,189,248,1)'),
                    ds('Assisted',            [7, 5, 5, 4, 7, 7, 6, 6, 3], 'rgba(52,211,153,1)'),
                    ds('Semi-Automated',      [8, 7, 7, 7, 5, 4, 4, 4, 5], 'rgba(250,204,21,1)'),
                    ds('Fully Automated',     [9, 9, 9, 9, 2, 1, 2, 1, 8], 'rgba(248,113,113,1)')
                ]
            },
            options
        });
    </script>
</body>
</html>
